name: Feedback source baseline
on:
  push:
    branches: ['chore/feedback-link-20260909']
    paths: ['.github/workflows/feedback-source.yml']
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
        with:
          ref: d73a19b5318d2a39ea80f02b62eba0429b44955b
          persist-credentials: false
      - run: |
          git archive --format=tar.gz --output=/tmp/feedback-source.tar.gz HEAD
          git rev-parse HEAD > /tmp/feedback-revision.txt
          sha256sum /tmp/feedback-source.tar.gz > /tmp/feedback-source.sha256
      - uses: actions/upload-artifact@v7
        with:
          name: feedback-source
          path: |
            /tmp/feedback-source.tar.gz
            /tmp/feedback-revision.txt
            /tmp/feedback-source.sha256
          retention-days: 2
          if-no-files-found: error
