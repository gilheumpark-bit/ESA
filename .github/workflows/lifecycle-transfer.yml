name: Apply lifecycle repair
on:
  push:
    branches: ['fix/audit-repair-20260927']
    paths: ['.github/workflows/lifecycle-transfer.yml', '.github/repair-transfer/**']
permissions:
  contents: read
jobs:
  apply:
    if: github.ref == 'refs/heads/fix/audit-repair-20260927'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Verify exact patch and apply source to isolated repair branch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/repair-transfer/{0,1,2,3}.b64 | base64 --decode | xz --decompress > "$RUNNER_TEMP/repair.patch"
          echo "0637e770aa77b0a72af40018ea7d36ef9df4a7b4f2cd01d23c90346b840dc7dc  $RUNNER_TEMP/repair.patch" | sha256sum --check
          git apply --check --index --exclude='.github/workflows/*' "$RUNNER_TEMP/repair.patch"
          git apply --index --exclude='.github/workflows/*' "$RUNNER_TEMP/repair.patch"
          git rm -- .github/repair-transfer/0.b64 .github/repair-transfer/1.b64 .github/repair-transfer/2.b64 .github/repair-transfer/3.b64
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: enforce quantity evidence and atomic lifecycle recovery'
          git push origin HEAD:refs/heads/fix/audit-repair-20260927
