name: Apply lifecycle verification corrections
on:
  push:
    branches: ['fix/audit-repair-20260927']
    paths: ['.github/workflows/lifecycle-transfer.yml']
permissions:
  contents: read
jobs:
  apply:
    if: github.ref == 'refs/heads/fix/audit-repair-20260927'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Apply exact reviewed correction patch
        shell: bash
        env:
          PATCH_XZ: ''
        run: |
          set -euo pipefail
          printf '%s' "$PATCH_XZ" | base64 --decode | xz --decompress > "$RUNNER_TEMP/repair.patch"
          echo 'd89ee90346784f5aa8e67cadb61818a744801887451a56404ed5cc677f3e8d9b'"  $RUNNER_TEMP/repair.patch" | sha256sum --check
          git apply --check --index "$RUNNER_TEMP/repair.patch"
          git apply --index "$RUNNER_TEMP/repair.patch"
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: complete lifecycle type contracts and boundary regressions'
          git push origin HEAD:refs/heads/fix/audit-repair-20260927
