name: CI

on:
  push:
    branches: [main, 'feat/**', 'fix/**', 'docs/**', 'codex/**', 'claude/**']
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 18 * * 0'
  workflow_dispatch:

permissions:
  contents: read

# Use ref_name so push and pull_request for one branch share a cancellation group.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  # Unconfigured-app lanes never borrow production credentials.
  NEXT_PUBLIC_FIREBASE_API_KEY: dummy
  NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: dummy
  NEXT_PUBLIC_FIREBASE_PROJECT_ID: dummy

jobs:
  verify:
    name: Verify (docs, types, lint, tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        node-version: [24]
    steps:
      - uses: actions/checkout@v7
        with:
          # Snapshot provenance must never rely on a depth=1 checkout.
          fetch-depth: 0
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Tracked development residue
        run: npm run gate:hygiene
      - name: Documentation contracts
        run: npm run check:docs
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint -- --max-warnings=0
      - name: Run tests
        # Coverage thresholds only execute when --coverage is supplied.
        run: npm test -- --ci --coverage --forceExit --json --outputFile=/tmp/esa-jest-results.json
      - name: Native script regressions
        run: npm run test:scripts
      - name: SLD V3 contract gate
        run: npm run gate:sld-v3-contract
      - name: Dependency audit ratchet (production)
        run: npm run gate:audit
      - name: Dependency audit ratchet (including development)
        run: npm run gate:audit:all
      - name: Realworld snapshot freshness
        run: npm run gate:snapshot
      - name: Build
        run: npm run build
      - name: Preserve unit test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-evidence
          path: /tmp/esa-jest-results.json
          retention-days: 7
          if-no-files-found: warn

  live-gates:
    name: Live gates (server, PDF, UI smoke)
    # Existing authenticated UI flows restore an invalid-signature fixture in
    # the real SDK. Its public config is explicit, not an absent/dummy setup.
    env:
      NEXT_PUBLIC_FIREBASE_API_KEY: esva-ui-synthetic-key
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: auth.esva-ui.example.invalid
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: esva-ui-fixture
    needs: verify
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        node-version: [24]
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Live AI calculator receipt gate
        run: npm run gate:chat-live
      - name: Install Chromium for UI smoke
        run: npx playwright install --with-deps chromium
      - name: Live PDF pipeline and UI smoke gates
        shell: bash
        run: |
          # PDF and browser tests need independent rate-limit state.
          # Do not increase production limits or trust spoofed headers for tests.
          app_pid=''
          cleanup() {
            if [ -n "$app_pid" ]; then
              kill "$app_pid" 2>/dev/null || true
              wait "$app_pid" 2>/dev/null || true
              app_pid=''
            fi
          }
          trap cleanup EXIT
          start_gate_server() {
            local port="$1"
            local logfile="$2"
            node node_modules/next/dist/bin/next start --hostname 127.0.0.1 --port "$port" > "$logfile" 2>&1 &
            app_pid=$!
            for attempt in $(seq 1 60); do
              if ! kill -0 "$app_pid" 2>/dev/null; then cat "$logfile"; return 1; fi
              if curl --fail --silent "http://127.0.0.1:$port/" > /dev/null; then return 0; fi
              sleep 1
            done
            cat "$logfile"
            return 1
          }
          start_gate_server 3010 /tmp/esa-pdf-next.log
          npm run gate:pdf -- http://127.0.0.1:3010
          cleanup
          start_gate_server 3011 /tmp/esa-next.log
          BASE_URL=http://127.0.0.1:3011 PLAYWRIGHT_JSON_OUTPUT_NAME=/tmp/esa-playwright-results.json npx playwright test --retries=0 --trace=retain-on-failure --reporter=line,json
      - name: Upload E2E failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-failure-evidence
          path: |
            test-results/
            /tmp/esa-next.log
            /tmp/esa-pdf-next.log
          retention-days: 7
          if-no-files-found: warn
      - name: Upload drawing error recovery screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: drawing-error-recovery-evidence
          path: |
            test-results/**/readable-error.png
            test-results/**/recovered-result.png
          retention-days: 7
          if-no-files-found: warn
      - name: Upload browser result and retained traces
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-execution-evidence
          path: |
            /tmp/esa-playwright-results.json
            test-results/
          retention-days: 7
          if-no-files-found: warn

  browser-compatibility:
    name: Browser compatibility (${{ matrix.browser }})
    needs: verify
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Portable browser and accessibility regressions
        shell: bash
        run: |
          node node_modules/next/dist/bin/next start --hostname 127.0.0.1 --port 3012 > /tmp/esa-compat.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true; wait "$app_pid" 2>/dev/null || true' EXIT
          ready=false
          for attempt in $(seq 1 60); do
            if ! kill -0 "$app_pid" 2>/dev/null; then cat /tmp/esa-compat.log; exit 1; fi
            if curl --fail --silent http://127.0.0.1:3012/ > /dev/null; then ready=true; break; fi
            sleep 1
          done
          if [ "$ready" != true ]; then cat /tmp/esa-compat.log; exit 1; fi
          BASE_URL=http://127.0.0.1:3012 PLAYWRIGHT_JSON_OUTPUT_NAME=/tmp/esa-compat-results.json npx playwright test --config=playwright.compat.config.ts --project=${{ matrix.browser }} --retries=0 --trace=retain-on-failure --reporter=line,json
      - name: Preserve compatibility evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-${{ matrix.browser }}-evidence
          path: |
            /tmp/esa-compat-results.json
            /tmp/esa-compat.log
            test-results/
          retention-days: 7
          if-no-files-found: warn
