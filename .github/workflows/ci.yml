name: CI

# 두 레인으로 나눈다.
#  - verify    : 모든 push/PR. 저장소 안에서 끝나는 결정론적 게이트만.
#  - live-gates: PR·주간 예약·수동 실행. 브라우저 설치와 production 서버 기동이
#                필요해 run 당 분 소모가 큰 게이트를 여기로 모은다.
# push 마다 무거운 레인을 돌리지 않는 것이 Actions 분 관리의 핵심이다.

on:
  push:
    branches: [main, 'feat/**', 'fix/**', 'docs/**', 'codex/**', 'claude/**']
  pull_request:
    branches: [main]
  schedule:
    # 매주 월요일 03:00 KST (일요일 18:00 UTC)
    - cron: '0 18 * * 0'
  workflow_dispatch:

# 같은 ref 에 연속 push 가 나면 앞선 run 을 취소한다. 중복 실행 분을 회수한다.
#
# 짝은 ref 가 아니라 **ref_name** 이어야 한다. push 의 `github.ref` 는
# `refs/heads/<브랜치>` 인데 pull_request 의 `github.head_ref` 는 접두사 없는
# `<브랜치>` 라, `head_ref || ref` 로는 두 문자열이 여전히 달라 그룹이 갈리고
# 같은 커밋이 두 번 검증된다(실측: run 30114652576 / 30114655819 동시 발생).
# `github.ref_name` 은 push 에서 접두사가 없으므로 head_ref 와 일치한다.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY || 'dummy' }}
  NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN || 'dummy' }}
  NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID || 'dummy' }}

jobs:
  verify:
    name: Verify (docs, types, lint, tests, build)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # pdfjs-dist@6 은 engines 로 node >=22.13 을 요구한다. Node 20 에서는
        # 텍스트 추출만 살아남고 기하(선분) 추출이 조용히 0 이 되어 gate:pdf 가
        # 6/17 로 떨어진다 — 실측 run 30124521173 의 "6 text items, 0 line
        # segments". 같은 커밋이 Node 24 에서는 17/17 이다(로컬 실측). 코드
        # 회귀가 아니라 런타임 미달이었으므로 개발 런타임과 버전을 맞춘다.
        node-version: [24]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Documentation contracts
        run: npm run check:docs

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      # --coverage 로 돌려야 jest 설정의 coverageThreshold 가 발화한다.
      # 임계만 선언하고 평소 실행에 --coverage 가 없으면 게이트가 등록만 되고
      # 한 번도 판정하지 않는다(§2.2 등록 ≠ 발화).
      - name: Run tests
        run: npm test -- --ci --coverage --forceExit

      - name: SLD V3 contract gate
        run: npm run gate:sld-v3-contract

      - name: Dependency audit ratchet
        run: npm run gate:audit

      - name: Realworld snapshot freshness
        run: npm run gate:snapshot

      - name: Build
        run: npm run build

  live-gates:
    name: Live gates (server, PDF, UI smoke)
    needs: verify
    # push 이벤트에서는 건너뛴다. PR·예약·수동 실행에서만 돈다.
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [24]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # 잡 사이에는 파일시스템이 공유되지 않으므로 여기서 다시 빌드한다.
      - name: Build
        run: npm run build

      - name: Live AI calculator receipt gate
        run: npm run gate:chat-live

      - name: Install Chromium for UI smoke
        run: npx playwright install --with-deps chromium

      - name: Live PDF pipeline and UI smoke gates
        shell: bash
        run: |
          npm start -- --hostname 127.0.0.1 --port 3010 > /tmp/esa-next.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3010/ > /dev/null; then
              break
            fi
            if ! kill -0 "$app_pid" 2>/dev/null; then
              cat /tmp/esa-next.log
              exit 1
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:3010/ > /dev/null
          npm run gate:pdf -- http://127.0.0.1:3010
          BASE_URL=http://127.0.0.1:3010 npx playwright test

      # E2E 실패는 스크린샷과 페이지 스냅샷 없이는 진단할 수 없다. DXF 실주행이
      # CI 에서만 실패하는데(run 30132954958) 로컬은 standalone·next start 양쪽
      # 모두 통과라 원격 산출물이 유일한 증거원이다. 서버 로그도 같이 올린다 —
      # 화면에 아무것도 안 나온 이유가 API 쪽일 수 있다.
      - name: Upload E2E failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-failure-evidence
          path: |
            test-results/
            /tmp/esa-next.log
          retention-days: 7
          if-no-files-found: warn
