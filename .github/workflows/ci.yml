name: CI

on:
  push:
    branches: [main, 'feat/**', 'fix/**', 'docs/**', 'codex/**']
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # pdfjs-dist@6 은 engines 로 node >=22.13 을 요구한다. Node 20 에서는
        # 텍스트 추출만 살아남고 기하(선분) 추출이 조용히 0 이 되어 gate:pdf 가
        # 6/17 로 떨어진다 — 실측 run 30124521173 의 "6 text items, 0 line
        # segments". 같은 커밋이 Node 24 에서는 17/17 이다(로컬 실측). 코드
        # 회귀가 아니라 런타임 미달이었으므로 개발 런타임과 버전을 맞춘다.
        node-version: [24]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Documentation contracts
        run: npm run check:docs

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      # --coverage 로 돌려야 jest.config.ts 의 coverageThreshold 가 발화한다.
      # 임계만 선언하고 평소 실행에 --coverage 가 없으면 게이트가 등록만 되고
      # 한 번도 판정하지 않는다(§ 등록 ≠ 발화).
      - name: Run tests
        run: npm test -- --ci --coverage --forceExit

      - name: SLD V3 contract gate
        run: npm run gate:sld-v3-contract

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY || 'dummy' }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN || 'dummy' }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID || 'dummy' }}

      - name: Live AI calculator receipt gate
        run: npm run gate:chat-live

      - name: Install Chromium for UI smoke
        run: npx playwright install --with-deps chromium

      - name: Live PDF pipeline and UI smoke gates
        shell: bash
        run: |
          npm start -- --hostname 127.0.0.1 --port 3010 > /tmp/esa-next.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3010/ > /dev/null; then
              break
            fi
            if ! kill -0 "$app_pid" 2>/dev/null; then
              cat /tmp/esa-next.log
              exit 1
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:3010/ > /dev/null
          npm run gate:pdf -- http://127.0.0.1:3010
          BASE_URL=http://127.0.0.1:3010 npx playwright test

      # E2E 실패는 스크린샷과 페이지 스냅샷 없이는 진단할 수 없다. DXF 실주행이
      # CI 에서만 실패하는데(run 30132954958) 로컬은 standalone·next start 양쪽
      # 모두 통과라 원격 산출물이 유일한 증거원이다. 서버 로그도 같이 올린다 —
      # 화면에 아무것도 안 나온 이유가 API 쪽일 수 있다.
      - name: Upload E2E failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure-evidence
          path: |
            test-results/
            /tmp/esa-next.log
          retention-days: 7
          if-no-files-found: warn
