name: Non-billing failure diagnostics
on:
  push:
    branches: ['chore/nonbilling-quality-20260910']
    paths: ['.github/workflows/nonbilling-diagnostics.yml']
permissions:
  contents: write
  actions: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Inspect original verification only; never rerun its tests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,subprocess,time,hashlib,tarfile
          repo='gilheumpark-bit/ESA'; run_id=34500130347
          def get(path): return json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/{path}'],text=True))
          for attempt in range(72):
              run=get(f'actions/runs/{run_id}')
              assert run['head_sha']=='a34ac736e6b9c8296489d8e2cf39ce978635efa1'
              if run['status']=='completed': break
              time.sleep(10)
          assert run['status']=='completed','verification did not complete within diagnostic window'
          root=Path('/tmp/nonbilling-diagnostic')
          subprocess.run(['gh','run','download',str(run_id),'--repo',repo,'--name','nonbilling-release-verification','--dir',str(root)],check=True)
          jobs=get(f'actions/runs/{run_id}/jobs?filter=latest&per_page=100')
          report={'runId':run_id,'headSha':run['head_sha'],'status':run['status'],'conclusion':run['conclusion'],
            'scope':'Preserved original run output; no new test execution',
            'jobs':[{'id':j['id'],'name':j['name'],'conclusion':j['conclusion'],'steps':[{k:s.get(k) for k in ['name','status','conclusion']} for s in j['steps']]} for j in jobs['jobs']]}
          def one(name):
            matches=list(root.rglob(name));return matches[0] if len(matches)==1 else None
          for filename,key in [('nonbilling-scope.json','scopeCheck'),('nonbilling-jest.json','jest'),('nonbilling-browser.json','browser')]:
            target=one(filename)
            if target is None: report[key]={'missing':True};continue
            value=json.loads(target.read_text())
            if key=='jest': value={k:value.get(k) for k in ['success','numPassedTests','numFailedTests','numPendingTests','numPassedTestSuites','numFailedTestSuites','numPendingTestSuites']}
            if key=='browser':
              failures=[];attempts=[]
              def visit(suite):
                for spec in suite.get('specs',[]):
                  for test in spec.get('tests',[]):
                    attempts.append({'status':test.get('status'),'attempts':[r.get('status') for r in test.get('results',[])]})
                    if test.get('status')!='expected':
                      failures.append({'file':spec.get('file'),'title':spec['title'],'status':test.get('status'),'results':[{'status':r.get('status'),'errors':r.get('errors',[])} for r in test.get('results',[])]})
                for child in suite.get('suites',[]): visit(child)
              for suite in value.get('suites',[]): visit(suite)
              value={'stats':value.get('stats'),'executions':len(attempts),
                'everyFirstAttemptPassed':bool(attempts) and all(t['status']=='expected' and t['attempts']==['passed'] for t in attempts),
                'failures':failures,'errors':value.get('errors',[])}
            report[key]=value
          for filename in ['nonbilling-production-audit.log','nonbilling-all-audit.log','nonbilling-scripts.log','nonbilling-pdf.log']:
            p=one(filename);report[filename]=p.read_text()[-4500:] if p else 'not recorded'
          p=one('nonbilling-prepared-sha.txt');report['preparedSha']=p.read_text().strip() if p else None
          hashes=one('nonbilling-hashes.json');source=one('nonbilling-product-source.tar.gz')
          if hashes and source:
            expected=json.loads(hashes.read_text());checked=[]
            with tarfile.open(source,'r:gz') as archive:
              for member in archive.getmembers():
                if not member.isfile():continue
                assert member.name in expected
                assert hashlib.sha256(archive.extractfile(member).read()).hexdigest()==expected[member.name],member.name
                checked.append(member.name)
            assert set(checked)==set(expected)
            report['sourceArchive']={'verifiedFiles':len(checked),'allManifestHashesMatch':True,'paths':sorted(checked)}
          report['artifacts']=[{k:a.get(k) for k in ['id','name','size_in_bytes','digest','expired']} for a in get(f'actions/runs/{run_id}/artifacts')['artifacts']]
          target=Path('.review-patches/validation-summary.json');target.write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n')
          print(target.read_text())
          PY
      - name: Publish evidence summary only on the isolated work branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f .review-patches/validation-summary.json
          git commit -m 'test: preserve actual final non-billing gate results and source integrity'
          git push origin HEAD:refs/heads/chore/nonbilling-quality-20260910
