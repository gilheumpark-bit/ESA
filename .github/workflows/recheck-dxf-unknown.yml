name: Recheck DXF unknown contract
on:
  push:
    branches: ['fix/uncertainty-recheck-20260909']
    paths: ['.github/workflows/recheck-dxf-unknown.yml']
permissions:
  contents: write
jobs:
  patch-and-check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Align public helper with unknown contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/engine/topology/dxf-parser.ts')
          s=p.read_text()
          old="""/** DXF 블록명 → 기기 종류. 사전 공백이 곧 미검출이라 단독 검사 대상이다. */
          export function resolveBlockType(blockName: string): SLDComponentType {
            return resolveBlockTypeOrNull(blockName) ?? 'load'; // 미식별 블록은 부하로 기본 분류
          }"""
          new="""/** DXF 블록명 → 기기 종류. 미식별은 실제 부하로 지어내지 않고 unknown으로 남긴다. */
          export function resolveBlockType(blockName: string): SLDComponentType {
            return resolveBlockTypeOrNull(blockName) ?? 'unknown';
          }"""
          assert s.count(old)==1, s.count(old)
          p.write_text(s.replace(old,new))
          p=Path('src/engine/topology/__tests__/symbol-library.test.ts')
          s=p.read_text()
          old="""  it('resolveBlockType 의 기존 계약은 유지된다 (미식별 = load, OrNull = null)', () => {
              expect(resolveBlockTypeOrNull('XX-7Q')).toBeNull();
              expect(resolveBlockType('XX-7Q')).toBe('load');
              expect(resolveBlockType('MCCB-1')).toBe('breaker');
            });"""
          new="""  it('resolveBlockType도 미식별을 부하로 지어내지 않고 unknown으로 보존한다', () => {
              expect(resolveBlockTypeOrNull('XX-7Q')).toBeNull();
              expect(resolveBlockType('XX-7Q')).toBe('unknown');
              expect(resolveBlockType('MCCB-1')).toBe('breaker');
            });"""
          assert s.count(old)==1, s.count(old)
          p.write_text(s.replace(old,new))
          PY
          git diff --check
      - name: Exact install and focused regression
        run: |
          npm ci
          npx jest --runInBand src/engine/topology/__tests__/symbol-library.test.ts src/engine/topology/__tests__/dxf-parser-adversarial.test.ts src/lib/__tests__/quick-drawing-readout.test.ts src/agent/drawing/__tests__/apply-drawing-correction.test.ts
          npx tsc --noEmit
          npm run lint -- --max-warnings=0
      - name: Push only the two reviewed product files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/engine/topology/dxf-parser.ts src/engine/topology/__tests__/symbol-library.test.ts
          git diff --cached --check
          git commit -m 'fix: keep unknown DXF blocks unknown across public helpers'
          git push origin HEAD:fix/uncertainty-recheck-20260909
