name: Apply verified repair patch
on:
  push:
    branches: ['fix/audit-repair-20260927']
    paths: ['.github/workflows/repair-bootstrap.yml', '.github/repair-transfer/**']
permissions:
  contents: read
jobs:
  apply:
    if: github.ref == 'refs/heads/fix/audit-repair-20260927'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Verify exact patch and apply source to isolated repair branch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/repair-transfer/{0,1,2,3}.b64 | base64 --decode | gzip --decompress > "$RUNNER_TEMP/repair.patch"
          echo "36b8d5e708b2c04b88640858530697a00b1a230b145ad0466303c45c65679958  $RUNNER_TEMP/repair.patch" | sha256sum --check
          # Workflow changes require the separately authorized GitHub connector.
          git apply --check --index --exclude='.github/workflows/*' "$RUNNER_TEMP/repair.patch"
          git apply --index --exclude='.github/workflows/*' "$RUNNER_TEMP/repair.patch"
          git rm -- .github/repair-transfer/0.b64 .github/repair-transfer/1.b64 .github/repair-transfer/2.b64 .github/repair-transfer/3.b64
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: bind output evidence, preserve Studio drafts and validate production runtime'
          git push origin HEAD:refs/heads/fix/audit-repair-20260927
